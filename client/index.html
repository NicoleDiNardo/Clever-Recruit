<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- logo-mark.svg is drawn entirely in white with no background of its own,
         so as a bare favicon it was invisible against a light browser tab.
         favicon.svg was already in public/ for exactly this and unreferenced. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <title>Clever Recruit</title>
    <script>
      // Prevent flash of wrong color scheme
      (function() {
        var scheme = localStorage.getItem('mantine-color-scheme-value');
        if (scheme === 'dark') {
          document.documentElement.setAttribute('data-mantine-color-scheme', 'dark');
        } else if (scheme === 'light' || !scheme) {
          document.documentElement.setAttribute('data-mantine-color-scheme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
